name: Commit message

# Native GitHub Rulesets need Pro on a private repo. This check is the
# free-plan equivalent: squash/merge to master must be "x.y.z: title".
on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [master]

concurrency:
  group: commit-message-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Semver subject
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test nomenclature scripts
        run: |
          bash scripts/check_commit_message_test.sh
          bash scripts/check_master_nomenclature_test.sh
          bash scripts/master_version_test.sh

      - name: Check PR title or master commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin master
            base="$(bash scripts/master_version.sh latest origin/master)"
            head_subject=""
            if [[ "${PR_COMMITS}" == "1" ]]; then
              head_subject="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" --jq '.[0].commit.message')"
            fi
            bash scripts/check_master_nomenclature.sh pr --base "${base}" "${PR_TITLE}" "${PR_COMMITS}" "${head_subject}"
          else
            if [[ -z "${BEFORE_SHA:-}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
              bash scripts/check_master_nomenclature.sh push "${COMMIT_MESSAGE}"
            else
              mapfile -t subjects < <(git log --format=%s "${BEFORE_SHA}..HEAD")
              if [[ ${#subjects[@]} -eq 0 ]]; then
                bash scripts/check_master_nomenclature.sh push "${COMMIT_MESSAGE}"
              else
                if base="$(bash scripts/master_version.sh latest "${BEFORE_SHA}" 2>/dev/null)"; then
                  bash scripts/check_master_nomenclature.sh push --base "${base}" "${subjects[@]}"
                else
                  bash scripts/check_master_nomenclature.sh push "${subjects[@]}"
                fi
              fi
            fi
          fi
