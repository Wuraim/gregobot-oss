name: Build & Push Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual rebuild"
        required: false
        default: "manual"

# Cancel a superseded in-flight run when a new commit lands on the same ref.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version and prepare tags
        id: meta
        shell: bash
        env:
          REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: bash scripts/docker_image_tags.sh

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=gregobot
            org.opencontainers.image.description=Personal Telegram bot + REST admin API
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.version=${{ steps.meta.outputs.image_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Single-platform image (no attestation index). Watchtower compares
          # :latest by digest and often ignores OCI manifest lists.
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.image_version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ping Watchtower
        env:
          WATCHTOWER_HTTP_API_URL: ${{ secrets.WATCHTOWER_HTTP_API_URL }}
          WATCHTOWER_HTTP_API_TOKEN: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WATCHTOWER_HTTP_API_URL}" ]]; then
            echo "WATCHTOWER_HTTP_API_URL not set — Watchtower will pick up :latest on its next poll"
            exit 0
          fi
          url="${WATCHTOWER_HTTP_API_URL%/}"
          auth=()
          if [[ -n "${WATCHTOWER_HTTP_API_TOKEN}" ]]; then
            auth=(-H "Authorization: Bearer ${WATCHTOWER_HTTP_API_TOKEN}")
          fi
          curl -fsS -X POST "${auth[@]}" "${url}/v1/update"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Docker Build Summary"
            echo ""
            echo "- **Commit:** \`${{ steps.meta.outputs.short_sha }}\`"
            echo "- **Image version:** \`${{ steps.meta.outputs.image_version }}\`"
            if [[ -n "${{ steps.meta.outputs.version }}" ]]; then
              echo "- **Semver tag:** \`${{ steps.meta.outputs.version }}\`"
            else
              echo "- **Semver tag:** _none (no \`x.y.z:\` prefix in commit)_"
            fi
            echo "- **Registry:** \`${{ secrets.REGISTRY_IMAGE }}\`"
            echo "- **Watchtower tag:** \`latest\` (single-platform, no attestations)"
            echo ""
            echo "### Tags pushed"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            if [[ -n "${{ steps.build.outputs.digest }}" ]]; then
              echo "### Image digest"
              echo ""
              echo "\`${{ steps.build.outputs.digest }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
