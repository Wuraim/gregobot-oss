[package]
name = "gregobot"
version = "0.21.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Personal Telegram fitness / productivity bot with an Axum REST admin API"
repository = "https://github.com/Wuraim/gregobot-oss"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = "0.8"

# Telegram bot
teloxide = { version = "0.17", features = ["macros", "webhooks-axum"] }

# Database
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "macros", "migrate", "chrono"] }
sqlite-vec = "0.1"
# sqlx-sqlite 0.9 allows libsqlite3-sys >=0.30.1, <0.38.0 — 0.38.2 is blocked.
libsqlite3-sys = "0.37"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Config / env
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Correlation IDs
uuid = { version = "1", features = ["v4"] }

# Error handling
anyhow = "1"

# HTTP client (for AI API calls)
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "native-tls",
] }

base64 = "0.23"

# default-features off avoids fontconfig/freetype system deps (ttf via font-kit).
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "chrono", "all_elements", "full_palette", "ab_glyph", "line_series"] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
